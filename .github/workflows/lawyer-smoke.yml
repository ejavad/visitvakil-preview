name: Lawyer messenger browser smoke
on:
  push:
    paths:
      - 'lawyer.js'
      - 'lawyer.html'
      - 'style.css'
      - 'tests/lawyer-smoke.mjs'
      - 'tests/lawyer-chats-smoke.mjs'
      - 'tests/lawyer-dashboard-smoke.mjs'
      - 'tests/lawyer-profile-smoke.mjs'
      - '.github/workflows/lawyer-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/lawyer-smoke.mjs
      - run: node tests/lawyer-chats-smoke.mjs
      - run: node tests/lawyer-dashboard-smoke.mjs
      - run: node tests/lawyer-profile-smoke.mjs
