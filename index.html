<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ویزیت وکیل | پیش‌نمایش</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#181818;font-family:Tahoma,Arial,sans-serif}.app{max-width:540px;margin:auto;min-height:100dvh;background:white;display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.mark{display:inline-block;background:#e8edb2;border-radius:12px;padding:8px 13px;margin-left:9px}.muted{font-size:12px;color:#777}main{padding:20px;flex:1}h1{font-size:22px;margin-top:25px}p{line-height:1.9;color:#666}.tabs{display:flex;gap:8px}.tabs button,.btn{font:inherit;border:1px solid #ddd;border-radius:12px;background:#fff;padding:11px;cursor:pointer}.tabs button{flex:1}.tabs button.active,.btn.primary{background:#e9edb3;border-color:#e9edb3}.card{border:1px solid #eee;border-radius:16px;padding:17px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:14px 0;cursor:pointer}.row:last-child{border:0}.pill{font-size:12px;background:#f2f2f2;padding:6px 9px;border-radius:20px}.bottom{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:13px 0;position:sticky;bottom:0;background:white}.bottom button{font:inherit;border:0;background:none;cursor:pointer;font-size:12px}.msg{padding:12px;background:#f3f3f3;border-radius:13px;margin:10px 0}.msg.mine{background:#eaf0bc;margin-right:12%}.composer{display:flex;gap:8px;margin-top:16px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.hidden{display:none}</style></head><body><div class="app"><header class="head"><div class="brand"><span class="mark">V</span>ویزیت وکیل</div><span class="muted">پیش‌نمایش مستقل</span></header><main><div class="tabs"><button class="active" onclick="mode('client',this)">کاربر</button><button onclick="mode('lawyer',this)">وکیل</button><button onclick="mode('admin',this)">مدیریت</button></div><h1 id="heading"></h1><p>نسخه آزمایشی رابط کاربری، بدون پیامک، احراز هویت و اتصال به سرور</p><section id="content"></section></main><nav class="bottom"><button onclick="view='home';render()">خانه</button><button onclick="view='chats';render()">گفتگوها</button><button onclick="view='requests';render()">درخواست‌ها</button><button onclick="view='support';render()">پشتیبانی</button><button onclick="view='account';render()">حساب</button></nav></div><script>let role='client',view='home',messages=['سلام، برای بررسی قرارداد ملکی راهنمایی می‌خواهم.','درود، لطفاً موضوع را توضیح دهید.'];function mode(r,b){role=r;view='home';document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function row(a,b,fn){return '<div class="row" onclick="'+fn+'"><span>'+a+'</span><span class="pill">'+b+'</span></div>'}function render(){document.getElementById('heading').textContent=({client:'مسنجر کاربر',lawyer:'مسنجر وکیل',admin:'پنل مدیریت'})[role];let c=document.getElementById('content');if(view==='home')c.innerHTML='<div class="card"><h2>خوش آمدید</h2><p>محیط '+({client:'مشاوره حقوقی',lawyer:'پذیرش درخواست‌ها',admin:'مدیریت درخواست‌ها'})[role]+'</p><button class="btn primary" onclick="view=\'requests\';render()">مشاهده درخواست‌ها</button></div>';if(view==='requests')c.innerHTML='<div class="card"><h2>درخواست‌های مشاوره</h2>'+row('مشاوره ملکی','جدید',"view='chats';render()")+row('اختلاف قرارداد','در حال بررسی',"view='chats';render()")+'<p><button class="btn primary" onclick="alert(\'درخواست آزمایشی ثبت شد\')">+ درخواست جدید</button></p></div>';if(view==='chats')c.innerHTML='<div class="card"><h2>گفتگوی آزمایشی</h2>'+messages.map((m,i)=>'<div class="msg '+(i%2?'mine':'')+'">'+m+'</div>').join('')+'<form class="composer" onsubmit="event.preventDefault();let x=document.getElementById(\'message\');if(x.value.trim()){messages.push(x.value.trim());render()}"><input id="message" placeholder="پیام خود را بنویسید"><button class="btn primary">ارسال</button></form></div>';if(view==='support')c.innerHTML='<div class="card"><h2>پشتیبانی</h2>'+row('پیگیری درخواست','باز',"view='chats';render()")+'<p><button class="btn primary" onclick="document.getElementById(\'newticket\').classList.remove(\'hidden\')">+ درخواست پشتیبانی جدید</button></p><div id="newticket" class="hidden"><input id="tickettitle" placeholder="عنوان درخواست"><p><button class="btn primary" onclick="alert(\'تیکت آزمایشی ثبت شد\')">ثبت درخواست</button></p></div></div>';if(view==='account')c.innerHTML='<div class="card"><h2>حساب آزمایشی</h2><p>در این پیش‌نمایش ورود واقعی وجود ندارد.</p></div>'}render()</script></body></html>
