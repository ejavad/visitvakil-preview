<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>ویزیت وکیل | مسنجر وکیل</title><link rel="stylesheet" href="style.css?v=lawyer-support-native-1" defer></head>
<body><div class="shell">
<header class="top"><div class="logo"><span class="mark">V</span><span>ویزیت وکیل<small>مشاوره حقوقی آنلاین</small></span></div><span class="top-note" id="top-state">پنل وکیل</span></header>
<main><section id="workspace"><div class="layout"><aside class="sidebar card"><div class="panelhead"><h1 id="lawyer-list-title">درخواست‌های جدید <span id="offer-count" class="lawyer-count" hidden>0</span></h1><button id="refresh" class="iconbtn" type="button" aria-label="بازخوانی">↻</button></div><label id="ready-control"><input id="ready" type="checkbox"> آماده پذیرش</label><div id="offers" class="inbox"></div><h2 id="cases-heading">گفتگوهای من</h2><div id="cases" class="inbox"></div><div id="note" class="pending" hidden></div><div id="support-list" class="inbox" hidden></div><details id="support-panel" class="support-native" hidden><summary id="support-new" class="primary">+ درخواست پشتیبانی جدید</summary><div class="support-native-body"><form id="support-form"><h2>درخواست پشتیبانی جدید</h2><label for="support-subject">موضوع درخواست</label><input id="support-subject" maxlength="160" required placeholder="موضوع پشتیبانی"><label for="support-body">شرح درخواست</label><textarea id="support-body" maxlength="10000" required rows="4" placeholder="مشکل یا درخواست خود را بنویسید"></textarea><div class="row"><button class="primary" type="submit">ثبت تیکت</button><button type="button" id="support-cancel" class="plain" >انصراف</button></div></form></div></details></aside><section class="conversation card"><div class="chathead"><button type="button" id="lawyer-back" class="chat-back" aria-label="بازگشت به فهرست"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button><div><strong id="header">گفتگوی وکیل</strong><small>موضوع مشاوره</small></div><button type="button" id="complete-consultation" class="plain" hidden>پایان مشاوره</button></div><div id="messages" class="messages"><div class="empty">یک گفتگو را انتخاب کنید.</div></div><form id="send" class="composer" hidden><input id="body" placeholder="پیام خود را بنویسید..." maxlength="10000" autocomplete="off"><button class="send" type="submit" aria-label="ارسال">↑</button></form></section></div></section></main><nav class="bottom lawyer-nav" aria-label="ناوبری اصلی"><button type="button" data-lawyer-tab="home"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></svg><span>خانه</span></button><button type="button" data-lawyer-tab="chats"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.4 8.4 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>گفتگوها</span></button><button type="button" data-lawyer-tab="activity" class="selected" aria-current="page"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>فعالیت <b id="nav-offer-count" class="lawyer-count" hidden>0</b></span></button><button type="button" data-lawyer-tab="support" title="گفتگوی پشتیبانی"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="12" width="4" height="7" rx="2"/><rect x="18" y="12" width="4" height="7" rx="2"/><path d="M20 19a5 5 0 0 1-5 3h-3"/></svg><span>پشتیبانی</span></button><button type="button" data-lawyer-tab="account"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/></svg><span>حساب</span></button></nav></div><script src="lawyer.js?v=lawyer-support-chat-3" defer></script><script>
/* Isolated preview support submit fallback; runs independently of lawyer.js. */
(function(){
 const key="visitvakil-preview-lawyer-support-v1";
 function saveTicket(event){
  event.preventDefault();event.stopImmediatePropagation();
  const form=document.getElementById("support-form");
  if(!form.reportValidity())return false;
  const subject=document.getElementById("support-subject").value.trim();
  const body=document.getElementById("support-body").value.trim();
  if(!subject||!body)return false;
  let rows=[];try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v))rows=v}catch(e){}
  const ticket={ticketId:"sample-"+Date.now(),subject,status:"open",lastMessage:body,previewMessages:[{body,mine:true}]};
  rows.unshift(ticket);
  try{localStorage.setItem(key,JSON.stringify(rows))}catch(e){alert("ذخیره در مرورگر مسدود است: "+e.message);return false}
  const list=document.getElementById("support-list");
  const card=document.createElement("button");card.type="button";card.className="thread support-thread selected";
  const title=document.createElement("strong");title.textContent=subject;
  const subtitle=document.createElement("span");subtitle.textContent="پشتیبانی فعال · "+body;
  card.append(title,subtitle);list.prepend(card);
  document.getElementById("support-panel").open=false;form.reset();
  function showTicket(){
   const workspace=document.getElementById("workspace");
   workspace.dataset.lawyerTab="support";
   workspace.classList.add("chat-open");
   document.getElementById("header").textContent=ticket.subject;
   const messages=document.getElementById("messages");messages.replaceChildren();
   for(const msg of ticket.previewMessages||[]){
    const bubble=document.createElement("div");bubble.className="bubble"+(msg.mine?" mine":"");
    bubble.textContent=msg.body;messages.append(bubble);
   }
   document.getElementById("send").hidden=ticket.status==="closed";
   const complete=document.getElementById("complete-consultation");
   complete.hidden=ticket.status==="closed";complete.textContent="بستن درخواست";
   document.getElementById("lawyer-back").hidden=false;
   for(const nav of document.querySelectorAll("[data-lawyer-tab]"))nav.classList.toggle("selected",nav.dataset.lawyerTab==="support");
   if(typeof previewSupport!=="undefined" && !previewSupport.some(x=>x.ticketId===ticket.ticketId))previewSupport.unshift(ticket);
   if(typeof openLawyerSupport==="function")openLawyerSupport(ticket);
   workspace.classList.add("chat-open");
  }
  card.onclick=showTicket;
  showTicket();
  return false;
 }
 document.addEventListener("submit",function(e){if(e.target&&e.target.id==="support-form")saveTicket(e)},true);
})();
</script></body></html>
